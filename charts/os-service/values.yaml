image:
  # Each cmd/ binary is built as its own image tag via `docker build --build-arg TARGET=<cmd>`.
  repository: ghcr.io/gabrielanfran/pos-os-service
  tags:
    server: server-latest
    dispatcher: outbox-dispatcher-latest
    worker: worker-latest
  pullPolicy: IfNotPresent

server:
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

dispatcher:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

env:
  OS_PORT: "8081"
  OS_DISPATCH_INTERVAL_MS: "500"

secret:
  # Not committed with real values; overridden via --set or a sealed secret /
  # external secret operator in each environment.
  dbDSN: "host=postgres user=postgres password=postgres dbname=os_service port=5432 sslmode=disable"
  amqpURL: "amqp://guest:guest@rabbitmq:5672/"
