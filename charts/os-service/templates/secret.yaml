apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-os-service-secret
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  OS_DB_DSN: {{ .Values.secret.dbDSN | quote }}
  OS_AMQP_URL: {{ .Values.secret.amqpURL | quote }}
